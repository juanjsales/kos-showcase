<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOS Showcase Hub 2.0 · Web & Automação</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
:root {
  /* COLORS */
  --kos-bg: #050806;
  --kos-card: #0d150f;
  --kos-border: rgba(34, 211, 238, 0.35);
  --kos-cyan: #22d3ee;
  --kos-cyan-bright: #06b6d4;
  --kos-text: #ffffff;
  --kos-muted: #a3b8ac;
  --white: #ffffff;
  --radius-pill: 100px;
  --shadow-lg: 0 20px 50px rgba(0, 0, 0, 0.9);
  --tr: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100vw; height: 100vh; overflow: hidden; background: var(--kos-bg); color: var(--kos-text); font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; }
body { display: flex; flex-direction: column; position: relative; }

/* LOGO KOS WEB & AUTOMAÇÃO */
.kos-brand-logo {
  display: flex; align-items: center; gap: 8px; text-decoration: none; cursor: pointer; flex-shrink: 0;
}
.kos-brand-main {
  font-family: monospace, 'Courier New', Courier; font-size: 1.2rem; font-weight: 900;
  letter-spacing: 0.08em; color: #ffffff; text-transform: uppercase; display: flex; align-items: center; gap: 4px;
}
.kos-brand-dot {
  display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  background: linear-gradient(90deg, #06b6d4 0%, #3b82f6 33%, #8b5cf6 66%, #ec4899 100%);
  box-shadow: 0 0 10px rgba(6, 182, 212, 0.9);
}
.kos-brand-sub {
  font-family: monospace, 'Courier New', Courier; font-size: 9px; letter-spacing: 0.06em;
  color: #22d3ee; font-weight: 700; text-transform: uppercase;
}

/* PAINEL SUPERIOR FIXO SEM SOBREPOR O SITE */
.topbar {
  width: 100%; height: 52px; min-height: 52px; max-height: 52px;
  background: rgba(10, 16, 12, 0.98); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-bottom: 1.5px solid var(--kos-border); padding: 0 14px;
  display: flex; align-items: center; justify-content: space-between; gap: 10px; z-index: 1000; flex-shrink: 0;
  box-sizing: border-box; overflow: hidden;
}

.header-left { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

.client-select-wrap {
  display: flex; align-items: center; gap: 6px; background: rgba(0, 0, 0, 0.5);
  border: 1px solid var(--kos-border); padding: 3px 8px; border-radius: 8px; height: 34px;
}
.client-select-wrap label { font-size: 0.68rem; font-weight: 800; text-transform: uppercase; color: var(--kos-cyan); white-space: nowrap; }
.client-select { background: transparent; border: none; color: #fff; font-family: inherit; font-weight: 700; font-size: 0.8rem; outline: none; cursor: pointer; }
.client-select option { background: #0d150f; color: #fff; }

.proto-dropdown-wrap {
  display: flex; align-items: center; gap: 6px; background: rgba(0, 0, 0, 0.6);
  border: 1.5px solid var(--kos-cyan); padding: 3px 8px; border-radius: 8px; height: 34px;
}
.proto-dropdown-label { font-size: 0.68rem; font-weight: 900; text-transform: uppercase; color: var(--kos-cyan); white-space: nowrap; }

.proto-select {
  background: transparent; border: none; color: #ffffff; font-family: inherit;
  font-weight: 800; font-size: 0.8rem; outline: none; cursor: pointer; max-width: 220px;
}
.proto-select option { background: #0d150f; color: #ffffff; font-weight: 700; padding: 6px; }

/* CENTRO: NAVEGADOR DE PÍLULAS */
.header-center { display: flex; align-items: center; justify-content: center; flex: 1; min-width: 0; overflow: hidden; gap: 4px; }

.nav-step-btn {
  background: rgba(255, 255, 255, 0.12); color: var(--white); border: 1px solid rgba(255, 255, 255, 0.25);
  height: 32px; padding: 0 10px; border-radius: var(--radius-pill); font-size: 0.75rem; font-weight: 800;
  cursor: pointer; display: flex; align-items: center; gap: 4px; transition: var(--tr); flex-shrink: 0; user-select: none;
}
.nav-step-btn:hover { background: var(--kos-cyan); color: #000; border-color: var(--kos-cyan); }

.proto-tabs {
  display: flex; gap: 4px; overflow-x: auto; scroll-behavior: smooth;
  scrollbar-width: none; max-width: 100%; padding: 2px 0;
}
.proto-tabs::-webkit-scrollbar { display: none; }

.proto-pill {
  background: rgba(255, 255, 255, 0.08); color: #ffffff; border: 1px solid rgba(255, 255, 255, 0.18);
  padding: 0 10px; height: 32px; border-radius: var(--radius-pill); font-weight: 800; font-size: 0.76rem;
  cursor: pointer; transition: var(--tr); display: inline-flex; align-items: center; gap: 4px;
  white-space: nowrap; flex-shrink: 0; user-select: none;
}
.proto-pill * { pointer-events: none; }
.proto-pill:hover { background: rgba(255, 255, 255, 0.2); color: #fff; }
.proto-pill.active {
  background: var(--kos-cyan); color: #000000; font-weight: 900; border-color: #fff;
  box-shadow: 0 0 15px rgba(34, 211, 238, 0.5);
}
.proto-badge-tag { font-size: 0.6rem; padding: 1px 5px; border-radius: 4px; background: rgba(0, 0, 0, 0.35); font-weight: 900; }

/* CONTROLES À DIREITA */
.header-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.device-btn-group { display: flex; gap: 2px; background: rgba(0, 0, 0, 0.5); padding: 2px; border-radius: 6px; border: 1px solid rgba(255, 255, 255, 0.15); }
.dev-btn { background: transparent; border: none; color: var(--kos-muted); padding: 3px 8px; height: 28px; border-radius: 4px; font-size: 0.74rem; font-weight: 700; cursor: pointer; transition: var(--tr); white-space: nowrap; }
.dev-btn:hover, .dev-btn.active { color: var(--white); background: rgba(255, 255, 255, 0.15); }
.dev-btn.active { color: var(--kos-cyan); font-weight: 900; }

.btn-action {
  background: rgba(255, 255, 255, 0.08); color: var(--white); border: 1px solid rgba(255, 255, 255, 0.18);
  padding: 0 10px; height: 32px; border-radius: var(--radius-pill); text-decoration: none; font-size: 0.74rem; font-weight: 800;
  cursor: pointer; transition: var(--tr); display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;
}
.btn-action:hover { background: var(--white); color: #000; }
.btn-action.primary { background: var(--kos-cyan); color: #000; border: none; font-weight: 900; }
.btn-action.primary:hover { background: #06b6d4; box-shadow: 0 4px 15px rgba(6, 182, 212, 0.4); }

/* MAIN STAGE */
.stage {
  width: 100%; height: calc(100vh - 52px); display: flex; justify-content: center; align-items: center;
  background: #030504; padding: 0; margin: 0 auto; position: relative; overflow: hidden; gap: 10px; box-sizing: border-box;
}

.iframe-wrapper {
  width: 100%; height: 100%; border-radius: 0; overflow: hidden; background: #fff;
  box-shadow: var(--shadow-lg); transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1); border: none;
  position: relative; flex: 1;
}

.iframe-wrapper.laptop { max-width: 1180px; height: 96%; border-radius: 18px; border: 10px solid #1a1a1a; margin: 0 auto; }
.iframe-wrapper.tablet { max-width: 768px; height: 96%; border-radius: 24px; border: 12px solid #1a1a1a; margin: 0 auto; }
.iframe-wrapper.mobile { max-width: 380px; height: 800px; max-height: 96%; border-radius: 36px; border: 10px solid #1a1a1a; position: relative; margin: 0 auto; }
.iframe-wrapper.mobile::before { content: ''; position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: 90px; height: 20px; background: #000; border-radius: 16px; z-index: 10; }

iframe { width: 100%; height: 100%; border: none; display: block; }
.stage.split .iframe-wrapper { height: 96%; border-radius: 14px; border: 1px solid rgba(255,255,255,0.15); }

/* MODAL QR CODE */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0, 0, 0, 0.88); backdrop-filter: blur(14px);
  display: flex; align-items: center; justify-content: center; z-index: 2000;
  opacity: 0; pointer-events: none; transition: var(--tr); padding: 20px;
}
.modal-overlay.open { opacity: 1; pointer-events: auto; }
.modal-card {
  background: #0d150f; border: 1.5px solid var(--kos-cyan); border-radius: 24px;
  padding: 32px 26px; max-width: 400px; width: 100%; text-align: center; box-shadow: var(--shadow-lg);
  position: relative; transform: scale(0.9); transition: var(--tr);
}
.modal-overlay.open .modal-card { transform: scale(1); }
.modal-close { position: absolute; top: 14px; right: 14px; background: transparent; border: none; color: var(--kos-muted); font-size: 1.5rem; cursor: pointer; }
.qr-frame { background: #fff; padding: 12px; border-radius: 16px; display: inline-block; margin: 16px 0; }
.qr-frame img { width: 180px; height: 180px; display: block; }

/* GAVETA FEEDBACK */
.feedback-drawer {
  position: fixed; right: -440px; top: 0; bottom: 0; width: 400px; max-width: 100%; background: #0d150f;
  border-left: 1.5px solid var(--kos-cyan); box-shadow: var(--shadow-lg); z-index: 2000;
  padding: 26px; display: flex; flex-direction: column; transition: right 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  overflow-y: auto;
}
.feedback-drawer.open { right: 0; }
.drawer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
.drawer-title { font-family: 'Syne', sans-serif; font-size: 1.2rem; font-weight: 800; color: var(--white); }

.fb-checklist { display: flex; flex-direction: column; gap: 12px; margin: 16px 0; }
.fb-check-item { display: flex; align-items: center; gap: 10px; font-size: 0.85rem; color: var(--white); font-weight: 600; }
.fb-check-item input { accent-color: var(--kos-cyan); width: 18px; height: 18px; cursor: pointer; }

@media (max-width: 900px) {
  .header-center { order: 3; width: 100%; justify-content: flex-start; margin-top: 4px; }
  .topbar { height: auto; max-height: none; padding: 8px 12px; }
  .device-btn-group { display: none; }
  .proto-select { max-width: 140px; }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="header-left">
    <a href="#" class="kos-brand-logo">
      <div class="kos-brand-main">
        KOS<span class="kos-brand-dot"></span>
      </div>
      <div class="kos-brand-sub">Web &amp; Automação</div>
    </a>

    <div class="client-select-wrap">
      <label>👤 Cliente:</label>
      <select class="client-select" id="clientSelect" onchange="onClientChange(this.value)">
      </select>
    </div>

    <div class="proto-dropdown-wrap">
      <label class="proto-dropdown-label">🎨 Opção:</label>
      <select class="proto-select" id="protoSelect" onchange="switchPrototype(this.value)">
      </select>
    </div>
  </div>

  <div class="header-center">
    <button class="nav-step-btn" onclick="stepOption(-1)" title="Opção Anterior">◄ Anterior</button>

    <div class="proto-tabs" id="protoTabs">
      <!-- Preenchido via JS -->
    </div>

    <button class="nav-step-btn" onclick="stepOption(1)" title="Próxima Opção">Próximo ►</button>
  </div>

  <div class="header-right">
    <div class="device-btn-group">
      <button class="dev-btn active" onclick="setDevice('desktop', this)" title="PC Desktop">🖥️ PC</button>
      <button class="dev-btn" onclick="setDevice('laptop', this)" title="Notebook">💻 Notebook</button>
      <button class="dev-btn" onclick="setDevice('tablet', this)" title="Tablet">📱 Tablet</button>
      <button class="dev-btn" onclick="setDevice('mobile', this)" title="Celular">📲 Celular</button>
    </div>

    <button class="btn-action" onclick="toggleSplitView()" id="splitBtn" title="Comparar 2 opções lado a lado">
      ⚔️ Comparar
    </button>

    <button class="btn-action" onclick="openQrModal()" title="Testar no celular real">
      📱 QR
    </button>

    <button class="btn-action" onclick="copyShareableLink()" title="Copiar link" id="copyBtn">
      🔗 Copiar
    </button>

    <a href="#" target="_blank" id="fullScreenBtn" class="btn-action primary">
      ↗️ Tela Cheia
    </a>

    <button onclick="toggleFeedbackDrawer()" class="btn-action primary" style="background: rgba(255,255,255,0.15); color: #fff;">
      💬 Feedback
    </button>
  </div>
</header>

<main class="stage" id="mainStage">
  <div class="iframe-wrapper" id="iframeWrapper">
    <iframe src="about:blank" id="prototypeFrame" title="Protótipo Principal KOS"></iframe>
  </div>

  <div class="iframe-wrapper" id="iframeWrapper2" style="display: none;">
    <div style="position: absolute; top: 10px; right: 10px; z-index: 20; background: #0d150f; padding: 4px 14px; border-radius: var(--radius-pill); font-size: 0.78rem; font-weight: 800; color: var(--kos-cyan); border: 1.5px solid var(--kos-cyan);">
      Comparando: <span id="splitProtoName">Opção B</span>
    </div>
    <iframe src="about:blank" id="prototypeFrame2" title="Protótipo de Comparação KOS"></iframe>
  </div>
</main>

<div class="modal-overlay" id="qrModal">
  <div class="modal-card">
    <button class="modal-close" onclick="closeQrModal()">×</button>
    <div style="font-family: 'Syne', sans-serif; font-size: 1.25rem; font-weight: 800; color: var(--white);">Testar no Celular Real</div>
    <p style="font-size: 0.85rem; color: var(--kos-muted); margin-top: 6px;">
      Aponte a câmera do seu smartphone para o QR Code abaixo:
    </p>

    <div class="qr-frame">
      <img src="" id="qrCodeImg" alt="QR Code do Protótipo">
    </div>

    <div style="font-size: 0.85rem; color: var(--kos-cyan); font-weight: 800;" id="qrProtoTitle">Opção A</div>
  </div>
</div>

<div class="feedback-drawer" id="feedbackDrawer">
  <div class="drawer-header">
    <div class="drawer-title">Aprovação do Protótipo</div>
    <button onclick="toggleFeedbackDrawer()" style="background: transparent; border: none; color: var(--kos-muted); font-size: 1.5rem; cursor: pointer;">×</button>
  </div>
  <p style="font-size: 0.85rem; color: var(--kos-muted); margin-bottom: 18px;">
    Envie seu parecer direto para a equipe da KOS Web &amp; Automação:
  </p>

  <div style="background: rgba(255, 255, 255, 0.05); padding: 16px; border-radius: 14px; border: 1px solid var(--kos-cyan); margin-bottom: 18px;">
    <div style="font-weight: 800; font-size: 0.9rem; color: var(--kos-cyan);" id="fbProtoTitle">Opção Selecionada</div>
    <div style="font-size: 0.78rem; color: var(--kos-muted);" id="fbClientName">Cliente</div>
  </div>

  <div class="fb-checklist">
    <label class="fb-check-item">
      <input type="checkbox" id="chkColors" checked> A paleta de cores combina com a marca
    </label>
    <label class="fb-check-item">
      <input type="checkbox" id="chkPhotos" checked> As fotos e imagens ficaram excelentes
    </label>
    <label class="fb-check-item">
      <input type="checkbox" id="chkMobile" checked> Visualização mobile ficou ótima
    </label>
  </div>

  <div style="margin-bottom: 18px;">
    <label style="display: block; font-size: 0.78rem; font-weight: 800; color: var(--kos-muted); margin-bottom: 6px;">Comentário Adicional (Opcional):</label>
    <textarea id="fbComment" style="width: 100%; height: 85px; background: rgba(0,0,0,0.4); border: 1px solid var(--kos-cyan); border-radius: 10px; padding: 12px; color: var(--white); font-family: inherit; font-size: 0.85rem; outline: none;" placeholder="Ex: Gostei muito da Opção J OneScreen..."></textarea>
  </div>

  <button onclick="sendFeedbackWsp('Aprovado')" class="btn-action primary" style="width: 100%; justify-content: center; padding: 14px; margin-bottom: 10px; font-size: 0.9rem;">
    ✅ Aprovar Este Modelo
  </button>
  
  <button onclick="sendFeedbackWsp('Ajustes')" class="btn-action" style="width: 100%; justify-content: center; padding: 14px; font-size: 0.88rem;">
    ✏️ Solicitar Pequenos Ajustes
  </button>
</div>

<script src="kos-config.js"></script>

<script>
let currentClient = null;
let currentProto = null;
let isSplitView = false;

window.addEventListener('DOMContentLoaded', () => {
  if (typeof KOS_HUB_CONFIG === 'undefined') {
    alert('Erro: kos-config.js não encontrado.');
    return;
  }

  const clientSel = document.getElementById('clientSelect');
  clientSel.innerHTML = KOS_HUB_CONFIG.clients.map(c => `
    <option value="${c.id}">${c.clientName}</option>
  `).join('');

  const urlParams = new URLSearchParams(window.location.search);
  const activeClientId = urlParams.get('client') || KOS_HUB_CONFIG.clients[0].id;
  clientSel.value = activeClientId;
  
  loadClient(activeClientId, urlParams.get('proto'));
});

function loadClient(clientId, targetProtoId = null) {
  currentClient = KOS_HUB_CONFIG.clients.find(c => c.id === clientId) || KOS_HUB_CONFIG.clients[0];

  const protoSel = document.getElementById('protoSelect');
  protoSel.innerHTML = currentClient.prototypes.map((p, idx) => `
    <option value="${p.id}">${String.fromCharCode(65 + idx)} — ${p.title.split('—')[1] || p.title} (${p.badge || 'Opção'})</option>
  `).join('');

  const tabsContainer = document.getElementById('protoTabs');
  tabsContainer.innerHTML = currentClient.prototypes.map((p, idx) => {
    const letter = String.fromCharCode(65 + idx);
    const shortTitle = getShortTitle(p.title);
    return `
      <button class="proto-pill" data-proto-id="${p.id}" onclick="switchPrototype('${p.id}')">
        <span class="proto-badge-tag">${letter}</span>
        ${shortTitle}
      </button>
    `;
  }).join('');

  const initialProto = targetProtoId 
    ? currentClient.prototypes.find(p => p.id === targetProtoId) || currentClient.prototypes[0]
    : currentClient.prototypes[0];

  switchPrototype(initialProto.id);
}

function getShortTitle(fullTitle) {
  if (fullTitle.includes('OneScreen')) return 'OneScreen ⚡';
  if (fullTitle.includes('Mouse-Driven')) return 'Mouse 3D';
  if (fullTitle.includes('Lotus Glow')) return 'Lótus Nude';
  if (fullTitle.includes('Bio-Reset')) return 'Bio-Reset 30D';
  if (fullTitle.includes('Official Card')) return 'Cartão Oficial';
  if (fullTitle.includes('Golden Hour')) return 'VIP Luxury';
  if (fullTitle.includes('Health Hub')) return 'Health Hub';
  if (fullTitle.includes('Wellness')) return 'Luxury';
  if (fullTitle.includes('Performance')) return 'Performance';
  if (fullTitle.includes('Organic')) return 'Minimalist';
  return fullTitle.split('—')[1] || fullTitle;
}

function switchPrototype(protoId) {
  currentProto = currentClient.prototypes.find(p => p.id === protoId) || currentClient.prototypes[0];

  let finalUrl = currentProto.url;
  if (finalUrl.startsWith('../')) {
    finalUrl = finalUrl.replace('../', '');
  }

  const iframe = document.getElementById('prototypeFrame');
  iframe.src = finalUrl;

  const fsBtn = document.getElementById('fullScreenBtn');
  if (fsBtn) fsBtn.href = finalUrl;

  const fbTitle = document.getElementById('fbProtoTitle');
  if (fbTitle) fbTitle.innerText = currentProto.title;
  
  const qrTitle = document.getElementById('qrProtoTitle');
  if (qrTitle) qrTitle.innerText = currentProto.title;

  const fbClient = document.getElementById('fbClientName');
  if (fbClient) fbClient.innerText = currentClient.clientName;

  const select = document.getElementById('protoSelect');
  if (select) select.value = currentProto.id;

  document.querySelectorAll('.proto-pill').forEach(btn => {
    const btnId = btn.getAttribute('data-proto-id');
    if (btnId === currentProto.id) {
      btn.classList.add('active');
      btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    } else {
      btn.classList.remove('active');
    }
  });

  const newUrl = `${window.location.pathname}?client=${currentClient.id}&proto=${currentProto.id}`;
  window.history.replaceState(null, '', newUrl);

  if (isSplitView) {
    updateSplitFrame();
  }
}

function stepOption(direction) {
  const protos = currentClient.prototypes;
  const currIdx = protos.findIndex(p => p.id === currentProto.id);
  let nextIdx = currIdx + direction;

  if (nextIdx < 0) nextIdx = protos.length - 1;
  if (nextIdx >= protos.length) nextIdx = 0;

  switchPrototype(protos[nextIdx].id);
}

function toggleSplitView() {
  isSplitView = !isSplitView;
  const stage = document.getElementById('mainStage');
  const frame2 = document.getElementById('iframeWrapper2');
  const btn = document.getElementById('splitBtn');

  if (isSplitView) {
    stage.classList.add('split');
    frame2.style.display = 'block';
    btn.style.background = 'var(--kos-cyan)';
    btn.style.color = '#000';
    updateSplitFrame();
  } else {
    stage.classList.remove('split');
    frame2.style.display = 'none';
    btn.style.background = 'rgba(255, 255, 255, 0.08)';
    btn.style.color = 'var(--white)';
  }
}

function updateSplitFrame() {
  const otherProtos = currentClient.prototypes.filter(p => p.id !== currentProto.id);
  const secondProto = otherProtos[0] || currentProto;
  
  let finalUrl = secondProto.url;
  if (finalUrl.startsWith('../')) {
    finalUrl = finalUrl.replace('../', '');
  }

  document.getElementById('prototypeFrame2').src = finalUrl;
  document.getElementById('splitProtoName').innerText = secondProto.title;
}

function onClientChange(clientId) {
  loadClient(clientId);
}

function setDevice(deviceType, btnEl) {
  document.querySelectorAll('.dev-btn').forEach(b => b.classList.remove('active'));
  btnEl.classList.add('active');

  const wrapper = document.getElementById('iframeWrapper');
  wrapper.className = 'iframe-wrapper ' + (deviceType === 'desktop' ? '' : deviceType);
}

function copyShareableLink() {
  const shareUrl = `${window.location.origin}${window.location.pathname}?client=${currentClient.id}&proto=${currentProto.id}`;
  navigator.clipboard.writeText(shareUrl).then(() => {
    alert(`Link Copiado com Sucesso!\n\nLink: ${shareUrl}`);
  }).catch(() => {
    prompt("Copie o link abaixo:", shareUrl);
  });
}

function openQrModal() {
  const shareUrl = `${window.location.origin}${window.location.pathname}?client=${currentClient.id}&proto=${currentProto.id}`;
  const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(shareUrl)}`;
  document.getElementById('qrCodeImg').src = qrApiUrl;
  document.getElementById('qrModal').classList.add('open');
}

function closeQrModal() {
  document.getElementById('qrModal').classList.remove('open');
}

function toggleFeedbackDrawer() {
  document.getElementById('feedbackDrawer').classList.toggle('open');
}

function sendFeedbackWsp(type) {
  const phone = KOS_HUB_CONFIG.agency.contactWhatsapp || "5521987385146";
  const statusMsg = type === 'Aprovado' ? '✅ APROVADO!' : '✏️ SOLICITOU AJUSTES';
  
  const comment = document.getElementById('fbComment').value;
  const colorsOk = document.getElementById('chkColors').checked ? '✓ Cores Ok' : '';
  const photosOk = document.getElementById('chkPhotos').checked ? '✓ Imagens Ok' : '';
  const mobileOk = document.getElementById('chkMobile').checked ? '✓ Mobile Ok' : '';
  const checks = [colorsOk, photosOk, mobileOk].filter(Boolean).join(' | ');

  let msg = `Olá! Sobre o protótipo da KOS Web & Automação:\n\n*Cliente:* ${currentClient.clientName}\n*Modelo:* ${currentProto.title}\n*Parecer:* ${statusMsg}`;
  if (checks) msg += `\n*Avaliação:* ${checks}`;
  if (comment) msg += `\n*Observações:* ${comment}`;

  window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank');
}
