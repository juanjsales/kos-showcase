<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOS Showcase Hub 2.0 · Web & Automação</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
:root {
  /* COLORS */
  --kos-bg: #030504;
  --kos-card: #0b120d;
  --kos-border: rgba(34, 211, 238, 0.4);
  --kos-cyan: #22d3ee;
  --kos-cyan-bright: #06b6d4;
  --kos-text: #ffffff;
  --kos-muted: #a3b8ac;
  --white: #ffffff;
  --radius-pill: 100px;
  --shadow-dock: 0 20px 60px rgba(0, 0, 0, 0.9), 0 0 30px rgba(34, 211, 238, 0.2);
  --tr: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--kos-bg); color: var(--kos-text); font-family: 'Plus Jakarta Sans', sans-serif; }
body { display: flex; flex-direction: column; position: relative; }

/* STAGE TELA CHEIA (100% DA ÁREA) */
.stage { width: 100vw; height: 100vh; position: absolute; inset: 0; background: #030504; display: flex; justify-content: center; align-items: center; padding: 0; overflow: hidden; }

.iframe-wrapper {
  width: 100%; height: 100%; border: none; background: #fff; position: relative; transition: var(--tr);
}
iframe { width: 100%; height: 100%; border: none; }

/* DISPOSITIVOS EM MOLDURA */
.iframe-wrapper.laptop { width: 92%; height: 88%; max-width: 1200px; border-radius: 20px; border: 12px solid #1a1a1a; box-shadow: var(--shadow-dock); margin-top: 30px; }
.iframe-wrapper.tablet { width: 768px; height: 88%; border-radius: 26px; border: 14px solid #1a1a1a; box-shadow: var(--shadow-dock); margin-top: 30px; }
.iframe-wrapper.mobile { width: 380px; height: 820px; max-height: 88%; border-radius: 40px; border: 12px solid #1a1a1a; box-shadow: var(--shadow-dock); margin-top: 30px; position: relative; }
.iframe-wrapper.mobile::before { content: ''; position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 90px; height: 20px; background: #000; border-radius: 16px; z-index: 10; }

/* SELETOR DE OPÇÕES FLUTUANTE (FLOATING CONTROL DOCK DYNAMIC ISLAND) */
.floating-dock {
  position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
  background: rgba(11, 18, 13, 0.92); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  border: 1.5px solid var(--kos-border); border-radius: var(--radius-pill);
  padding: 6px 12px; display: flex; align-items: center; gap: 10px; z-index: 9999;
  box-shadow: var(--shadow-dock); transition: var(--tr); max-width: 96vw;
}
.floating-dock:hover { border-color: var(--kos-cyan); box-shadow: 0 25px 70px rgba(0, 0, 0, 0.95), 0 0 40px rgba(34, 211, 238, 0.35); }

/* BRANDING DA AGÊNCIA NO DOCK */
.dock-brand {
  display: flex; align-items: center; gap: 6px; font-family: monospace, 'Courier New', Courier;
  font-weight: 900; font-size: 1rem; color: #fff; text-decoration: none; border-right: 1px solid rgba(255,255,255,0.15); padding-right: 10px; flex-shrink: 0;
}
.dock-brand-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--kos-cyan); box-shadow: 0 0 8px var(--kos-cyan); }

/* CONTROLES DE ANTERIOR E PRÓXIMO NO DOCK */
.dock-step-btn {
  background: rgba(255, 255, 255, 0.12); color: #fff; border: 1px solid rgba(255, 255, 255, 0.2);
  width: 32px; height: 32px; border-radius: 50%; font-size: 0.8rem; font-weight: 900;
  cursor: pointer; display: flex; align-items: center; justify-content: center; transition: var(--tr); flex-shrink: 0; user-select: none;
}
.dock-step-btn:hover { background: var(--kos-cyan); color: #000; transform: scale(1.1); }

/* CONTAINER DE PÍLULAS DAS OPÇÕES */
.dock-tabs {
  display: flex; gap: 6px; overflow-x: auto; scroll-behavior: smooth;
  scrollbar-width: none; max-width: 50vw; padding: 2px 0;
}
.dock-tabs::-webkit-scrollbar { display: none; }

.dock-pill {
  background: rgba(255, 255, 255, 0.08); color: #ffffff; border: 1px solid rgba(255, 255, 255, 0.18);
  padding: 0 14px; height: 34px; border-radius: var(--radius-pill); font-weight: 800; font-size: 0.8rem;
  cursor: pointer; transition: var(--tr); display: inline-flex; align-items: center; gap: 6px;
  white-space: nowrap; flex-shrink: 0; user-select: none;
}
.dock-pill * { pointer-events: none; }
.dock-pill:hover { background: rgba(255, 255, 255, 0.22); color: #fff; }
.dock-pill.active {
  background: var(--kos-cyan); color: #000000; font-weight: 900; border-color: #fff;
  box-shadow: 0 0 20px rgba(34, 211, 238, 0.7); transform: scale(1.03);
}
.dock-letter { font-size: 0.68rem; padding: 2px 6px; border-radius: 5px; background: rgba(0, 0, 0, 0.35); font-weight: 900; }

/* BOTÃO DE DROPDOWN EXPANSÍVEL NO DOCK */
.dock-menu-btn {
  background: rgba(34, 211, 238, 0.15); color: var(--kos-cyan); border: 1px solid var(--kos-border);
  padding: 0 14px; height: 34px; border-radius: var(--radius-pill); font-weight: 800; font-size: 0.78rem;
  cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: var(--tr); white-space: nowrap; flex-shrink: 0;
}
.dock-menu-btn:hover { background: var(--kos-cyan); color: #000; }

/* DISPOSITIVOS E AÇÕES */
.dock-actions { display: flex; align-items: center; gap: 6px; border-left: 1px solid rgba(255,255,255,0.15); padding-left: 10px; flex-shrink: 0; }
.dock-dev-btn { background: transparent; border: none; color: var(--kos-muted); width: 30px; height: 30px; border-radius: 6px; font-size: 0.85rem; cursor: pointer; transition: var(--tr); }
.dock-dev-btn:hover, .dock-dev-btn.active { color: #fff; background: rgba(255, 255, 255, 0.15); }
.dock-dev-btn.active { color: var(--kos-cyan); }

.dock-cta {
  background: var(--kos-cyan); color: #000; border: none; padding: 0 14px; height: 32px; border-radius: var(--radius-pill);
  font-weight: 800; font-size: 0.76rem; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; transition: var(--tr); white-space: nowrap;
}
.dock-cta:hover { background: #06b6d4; transform: translateY(-1px); box-shadow: 0 4px 15px rgba(6, 182, 212, 0.4); }

/* MENU MODAL EXPANSÍVEL COM TODAS AS OPÇÕES EM CARDS */
.options-modal {
  position: fixed; inset: 0; background: rgba(0, 0, 0, 0.88); backdrop-filter: blur(16px);
  display: flex; align-items: center; justify-content: center; z-index: 10000;
  opacity: 0; pointer-events: none; transition: var(--tr); padding: 20px;
}
.options-modal.open { opacity: 1; pointer-events: auto; }
.options-card {
  background: #0b120d; border: 1.5px solid var(--kos-cyan); border-radius: 28px;
  padding: 32px; max-width: 850px; width: 100%; box-shadow: var(--shadow-dock);
  position: relative; transform: scale(0.92); transition: var(--tr); max-height: 85vh; overflow-y: auto;
}
.options-modal.open .options-card { transform: scale(1); }
.modal-close { position: absolute; top: 16px; right: 20px; background: transparent; border: none; color: var(--kos-muted); font-size: 1.6rem; cursor: pointer; }

.opts-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-top: 24px; }
.opt-item-card {
  background: rgba(255, 255, 255, 0.05); border: 1.5px solid rgba(255, 255, 255, 0.12);
  padding: 18px 20px; border-radius: 18px; cursor: pointer; transition: var(--tr); display: flex; flex-direction: column; gap: 6px;
}
.opt-item-card:hover, .opt-item-card.active { border-color: var(--kos-cyan); background: rgba(34, 211, 238, 0.12); transform: translateY(-3px); }
.opt-item-header { display: flex; justify-content: space-between; align-items: center; }
.opt-item-letter { font-size: 0.72rem; font-weight: 900; padding: 2px 8px; border-radius: 6px; background: rgba(0,0,0,0.4); color: var(--kos-cyan); }
.opt-item-badge { font-size: 0.68rem; font-weight: 800; padding: 2px 8px; border-radius: 100px; color: #000; }
.opt-item-title { font-size: 0.95rem; font-weight: 800; color: #fff; }
.opt-item-sub { font-size: 0.78rem; color: var(--kos-muted); }

/* GAVETA FEEDBACK */
.feedback-drawer {
  position: fixed; right: -440px; top: 0; bottom: 0; width: 400px; max-width: 100%; background: #0b120d;
  border-left: 1.5px solid var(--kos-cyan); box-shadow: var(--shadow-dock); z-index: 10001;
  padding: 26px; display: flex; flex-direction: column; transition: right 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  overflow-y: auto;
}
.feedback-drawer.open { right: 0; }

@media (max-width: 850px) {
  .floating-dock { top: 10px; padding: 4px 8px; gap: 6px; }
  .dock-tabs { max-width: 40vw; }
  .dock-actions { display: none; }
  .opts-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- STAGE DA TELA CHEIA (100% DA VISUALIZAÇÃO) -->
<main class="stage" id="mainStage">
  <div class="iframe-wrapper" id="iframeWrapper">
    <iframe src="about:blank" id="prototypeFrame" title="Protótipo Principal KOS"></iframe>
  </div>
</main>

<!-- SELETOR DE OPÇÕES FLUTUANTE (FLOATING CONTROL DOCK DYNAMIC ISLAND) -->
<div class="floating-dock">
  <a href="#" class="dock-brand" title="KOS Web & Automação">
    KOS<span class="dock-brand-dot"></span>
  </a>

  <!-- BOTÃO ANTERIOR -->
  <button class="dock-step-btn" onclick="stepOption(-1)" title="Opção Anterior">◄</button>

  <!-- PÍLULAS DE OPÇÕES COM TROCA RÁPIDA -->
  <div class="dock-tabs" id="dockTabs">
    <!-- Preenchido via JS -->
  </div>

  <!-- BOTÃO PRÓXIMO -->
  <button class="dock-step-btn" onclick="stepOption(1)" title="Próxima Opção">►</button>

  <!-- BOTÃO PARA ABRIR O PAINEL EXPANSÍVEL DE TODAS AS OPÇÕES -->
  <button class="dock-menu-btn" onclick="toggleOptionsModal()">
    🎨 Todas as Opções <span style="font-size:0.7rem;">▼</span>
  </button>

  <!-- DISPOSITIVOS E AÇÕES FLUTUANTES -->
  <div class="dock-actions">
    <button class="dock-dev-btn active" onclick="setDevice('desktop', this)" title="PC Desktop">🖥️</button>
    <button class="dock-dev-btn" onclick="setDevice('laptop', this)" title="Notebook">💻</button>
    <button class="dock-dev-btn" onclick="setDevice('tablet', this)" title="Tablet">📱</button>
    <button class="dock-dev-btn" onclick="setDevice('mobile', this)" title="Celular">📲</button>

    <a href="#" target="_blank" id="fullScreenBtn" class="dock-cta">
      ↗️ Tela Cheia
    </a>

    <button onclick="toggleFeedbackDrawer()" class="dock-cta" style="background: rgba(255,255,255,0.12); color: #fff;">
      💬 Feedback
    </button>
  </div>
</div>

<!-- MODAL EXPANSÍVEL COM VISUALIZADOR DE TODAS AS OPÇÕES EM CARDS -->
<div class="options-modal" id="optionsModal">
  <div class="options-card">
    <button class="modal-close" onclick="toggleOptionsModal()">×</button>
    <div style="font-family: 'Syne', sans-serif; font-size: 1.4rem; font-weight: 800; color: #fff;">Selecione o Modelo de Protótipo</div>
    <p style="font-size: 0.85rem; color: var(--kos-muted); margin-top: 4px;">
      Escolha abaixo entre as opções criadas para a Dra. Silvia de Oliveira Lemos:
    </p>

    <div class="opts-grid" id="optsGridModal">
      <!-- Preenchido dinamicamente via JS com cards das opções -->
    </div>
  </div>
</div>

<!-- GAVETA DE FEEDBACK -->
<div class="feedback-drawer" id="feedbackDrawer">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px;">
    <div style="font-family: 'Syne', sans-serif; font-size: 1.2rem; font-weight: 800; color: var(--white);">Aprovação do Protótipo</div>
    <button onclick="toggleFeedbackDrawer()" style="background: transparent; border: none; color: var(--kos-muted); font-size: 1.5rem; cursor: pointer;">×</button>
  </div>

  <div style="background: rgba(255, 255, 255, 0.05); padding: 16px; border-radius: 14px; border: 1px solid var(--kos-cyan); margin-bottom: 18px;">
    <div style="font-weight: 800; font-size: 0.9rem; color: var(--kos-cyan);" id="fbProtoTitle">Opção Selecionada</div>
  </div>

  <div style="margin-bottom: 18px;">
    <label style="display: block; font-size: 0.78rem; font-weight: 800; color: var(--kos-muted); margin-bottom: 6px;">Comentário Adicional:</label>
    <textarea id="fbComment" style="width: 100%; height: 85px; background: rgba(0,0,0,0.4); border: 1px solid var(--kos-cyan); border-radius: 10px; padding: 12px; color: #fff; font-family: inherit; font-size: 0.85rem; outline: none;" placeholder="Ex: Gostei muito da Opção H..."></textarea>
  </div>

  <button onclick="sendFeedbackWsp('Aprovado')" class="dock-cta" style="width: 100%; justify-content: center; height: 42px; font-size: 0.9rem; margin-bottom: 10px;">
    ✅ Aprovar Este Modelo
  </button>
  <button onclick="sendFeedbackWsp('Ajustes')" class="dock-cta" style="width: 100%; justify-content: center; height: 42px; font-size: 0.88rem; background: rgba(255,255,255,0.12); color: #fff;">
    ✏️ Solicitar Pequenos Ajustes
  </button>
</div>

<script src="kos-config.js"></script>

<script>
let currentClient = null;
let currentProto = null;

window.addEventListener('DOMContentLoaded', () => {
  if (typeof KOS_HUB_CONFIG === 'undefined') {
    alert('Erro: kos-config.js não encontrado.');
    return;
  }

  const urlParams = new URLSearchParams(window.location.search);
  const activeClientId = urlParams.get('client') || KOS_HUB_CONFIG.clients[0].id;
  
  loadClient(activeClientId, urlParams.get('proto'));
});

function loadClient(clientId, targetProtoId = null) {
  currentClient = KOS_HUB_CONFIG.clients.find(c => c.id === clientId) || KOS_HUB_CONFIG.clients[0];

  // POPULA PÍLULAS NO DOCK FLUTUANTE
  const dockTabs = document.getElementById('dockTabs');
  dockTabs.innerHTML = currentClient.prototypes.map((p, idx) => {
    const letter = String.fromCharCode(65 + idx);
    const shortTitle = getShortTitle(p.title);
    return `
      <button class="dock-pill" data-proto-id="${p.id}" onclick="switchPrototype('${p.id}')">
        <span class="dock-letter">${letter}</span>
        ${shortTitle}
      </button>
    `;
  }).join('');

  // POPULA MODAL EXPANSÍVEL DE TODAS AS OPÇÕES
  const gridModal = document.getElementById('optsGridModal');
  gridModal.innerHTML = currentClient.prototypes.map((p, idx) => {
    const letter = String.fromCharCode(65 + idx);
    return `
      <div class="opt-item-card" id="cardOpt_${p.id}" onclick="switchPrototype('${p.id}'); toggleOptionsModal();">
        <div class="opt-item-header">
          <span class="opt-item-letter">OPÇÃO ${letter}</span>
          <span class="opt-item-badge" style="background: ${p.badgeColor || '#06b6d4'};">${p.badge || 'Modelo'}</span>
        </div>
        <div class="opt-item-title">${p.title}</div>
        <div class="opt-item-sub">${p.subtitle || ''}</div>
      </div>
    `;
  }).join('');

  const initialProto = targetProtoId 
    ? currentClient.prototypes.find(p => p.id === targetProtoId) || currentClient.prototypes[0]
    : currentClient.prototypes[0];

  switchPrototype(initialProto.id);
}

function getShortTitle(fullTitle) {
  if (fullTitle.includes('Mouse-Driven')) return 'Mouse 3D';
  if (fullTitle.includes('Lotus Glow')) return 'Lótus Nude';
  if (fullTitle.includes('Bio-Reset')) return 'Bio-Reset 30D';
  if (fullTitle.includes('Official Card')) return 'Cartão Oficial';
  if (fullTitle.includes('Health Hub')) return 'Health Hub';
  if (fullTitle.includes('Wellness')) return 'Luxury';
  if (fullTitle.includes('Performance')) return 'Performance';
  if (fullTitle.includes('Organic')) return 'Minimalist';
  return fullTitle.split('—')[1] || fullTitle;
}

function switchPrototype(protoId) {
  currentProto = currentClient.prototypes.find(p => p.id === protoId) || currentClient.prototypes[0];

  let finalUrl = currentProto.url;
  if (finalUrl.startsWith('../')) {
    finalUrl = finalUrl.replace('../', '');
  }

  const iframe = document.getElementById('prototypeFrame');
  iframe.src = finalUrl;

  const fsBtn = document.getElementById('fullScreenBtn');
  if (fsBtn) fsBtn.href = finalUrl;

  const fbTitle = document.getElementById('fbProtoTitle');
  if (fbTitle) fbTitle.innerText = currentProto.title;

  // Destaca a pílula ativa no Dock Flutuante
  document.querySelectorAll('.dock-pill').forEach(btn => {
    const btnId = btn.getAttribute('data-proto-id');
    if (btnId === currentProto.id) {
      btn.classList.add('active');
      btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    } else {
      btn.classList.remove('active');
    }
  });

  // Destaca o card no Modal
  document.querySelectorAll('.opt-item-card').forEach(card => card.classList.remove('active'));
  const activeCard = document.getElementById(`cardOpt_${currentProto.id}`);
  if (activeCard) activeCard.classList.add('active');

  const newUrl = `${window.location.pathname}?client=${currentClient.id}&proto=${currentProto.id}`;
  window.history.replaceState(null, '', newUrl);
}

function stepOption(direction) {
  const protos = currentClient.prototypes;
  const currIdx = protos.findIndex(p => p.id === currentProto.id);
  let nextIdx = currIdx + direction;

  if (nextIdx < 0) nextIdx = protos.length - 1;
  if (nextIdx >= protos.length) nextIdx = 0;

  switchPrototype(protos[nextIdx].id);
}

function toggleOptionsModal() {
  document.getElementById('optionsModal').classList.toggle('open');
}

function setDevice(deviceType, btnEl) {
  document.querySelectorAll('.dock-dev-btn').forEach(b => b.classList.remove('active'));
  btnEl.classList.add('active');

  const wrapper = document.getElementById('iframeWrapper');
  wrapper.className = 'iframe-wrapper ' + (deviceType === 'desktop' ? '' : deviceType);
}

function toggleFeedbackDrawer() {
  document.getElementById('feedbackDrawer').classList.toggle('open');
}

function sendFeedbackWsp(type) {
  const phone = KOS_HUB_CONFIG.agency.contactWhatsapp || "5521987385146";
  const statusMsg = type === 'Aprovado' ? '✅ APROVADO!' : '✏️ SOLICITOU AJUSTES';
  const comment = document.getElementById('fbComment').value;

  let msg = `Olá! Sobre o protótipo da KOS Web & Automação:\n\n*Cliente:* ${currentClient.clientName}\n*Modelo:* ${currentProto.title}\n*Parecer:* ${statusMsg}`;
  if (comment) msg += `\n*Observações:* ${comment}`;

  window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank');
}
</script>
</body>
</html>
