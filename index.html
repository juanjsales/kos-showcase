<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KOS Showcase Hub · Dra. Silvia de Oliveira Lemos</title>

<!-- METADADOS DE SEO E SOCIAL SHARING -->
<meta name="title" content="Dra. Silvia de Oliveira Lemos · Nutricionista">
<meta name="description" content="Site oficial da Dra. Silvia de Oliveira Lemos. Nutrição Clínica, Esportiva e Emagrecimento. CRN-4 24987/P.">
<meta name="keywords" content="Silvia de Oliveira Lemos, Nutricionista, CRN-4, Emagrecimento, Nutrição Esportiva, KOS Web & Automação">
<meta name="author" content="KOS Web & Automação">

<!-- OPEN GRAPH / FACEBOOK / WHATSAPP CARDS -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://github.com/juanjsales/kos-showcase">
<meta property="og:title" content="Dra. Silvia de Oliveira Lemos · Nutricionista">
<meta property="og:description" content="Site oficial da Dra. Silvia de Oliveira Lemos. Nutrição Clínica, Esportiva e Emagrecimento. CRN-4 24987/P.">
<meta property="og:image" content="assets/kos-og-image.png">

<!-- FAVICON & BRAND ICONS -->
<link rel="icon" type="image/png" href="assets/favicon-kos.png">
<link rel="apple-touch-icon" href="assets/kos-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
:root {
  /* COLORS */
  --kos-bg: #050806;
  --kos-card: #0d150f;
  --kos-border: rgba(34, 211, 238, 0.35);
  --kos-cyan: #22d3ee;
  --kos-cyan-bright: #06b6d4;
  --kos-text: #ffffff;
  --kos-muted: #a3b8ac;
  --white: #ffffff;
  --radius-pill: 100px;
  --shadow-lg: 0 20px 50px rgba(0, 0, 0, 0.9);
  --tr: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100vw; height: 100vh; overflow: hidden; background: var(--kos-bg); color: var(--kos-text); font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; }
body { display: flex; flex-direction: column; position: relative; }

/* LOGO KOS WEB & AUTOMAÇÃO */
.kos-brand-logo {
  display: flex; align-items: center; gap: 6px; text-decoration: none; cursor: pointer; flex-shrink: 0;
}
.kos-brand-img {
  height: 26px; width: auto; display: block; object-fit: contain;
}
.kos-brand-sub {
  font-family: monospace, 'Courier New', Courier; font-size: 8.5px; letter-spacing: 0.06em;
  color: #22d3ee; font-weight: 700; text-transform: uppercase;
}

/* PAINEL SUPERIOR FIXO */
.topbar {
  width: 100%; height: 52px; min-height: 52px; max-height: 52px;
  background: rgba(10, 16, 12, 0.98); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-bottom: 1.5px solid var(--kos-border); padding: 0 14px;
  display: flex; align-items: center; justify-content: space-between; gap: 10px; z-index: 1000; flex-shrink: 0;
  box-sizing: border-box; overflow: hidden;
}

.header-left { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

.approved-badge {
  display: flex; align-items: center; gap: 6px; background: rgba(146, 169, 136, 0.18);
  border: 1px solid #92a988; padding: 4px 12px; border-radius: 8px; height: 32px;
  font-size: 0.78rem; font-weight: 800; color: #92a988; white-space: nowrap;
}

.client-label-badge {
  display: flex; align-items: center; gap: 5px; background: rgba(34, 211, 238, 0.12);
  border: 1px solid var(--kos-cyan); padding: 3px 10px; border-radius: 8px; height: 32px;
  font-size: 0.74rem; font-weight: 800; color: #ffffff; white-space: nowrap;
}

.client-select-wrap {
  display: flex; align-items: center; gap: 4px; background: rgba(0, 0, 0, 0.5);
  border: 1px solid var(--kos-border); padding: 2px 6px; border-radius: 8px; height: 32px;
}
.client-select-wrap label { font-size: 0.65rem; font-weight: 800; text-transform: uppercase; color: var(--kos-cyan); white-space: nowrap; }
.client-select { background: transparent; border: none; color: #fff; font-family: inherit; font-weight: 700; font-size: 0.76rem; outline: none; cursor: pointer; }
.client-select option { background: #0d150f; color: #fff; }

.proto-dropdown-wrap {
  display: flex; align-items: center; gap: 4px; background: rgba(0, 0, 0, 0.6);
  border: 1.5px solid var(--kos-cyan); padding: 2px 6px; border-radius: 8px; height: 32px;
}
.proto-dropdown-label { font-size: 0.65rem; font-weight: 900; text-transform: uppercase; color: var(--kos-cyan); white-space: nowrap; }

.proto-select {
  background: transparent; border: none; color: #ffffff; font-family: inherit;
  font-weight: 800; font-size: 0.76rem; outline: none; cursor: pointer; max-width: 140px;
}
.proto-select option { background: #0d150f; color: #ffffff; font-weight: 700; padding: 6px; }

/* CENTRO: STATUS NAVEGAÇÃO */
.header-center { display: flex; align-items: center; justify-content: center; flex: 1; min-width: 0; overflow: hidden; gap: 4px; }

/* CONTROLES À DIREITA */
.header-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.device-btn-group { display: flex; gap: 2px; background: rgba(0, 0, 0, 0.5); padding: 2px; border-radius: 6px; border: 1px solid rgba(255, 255, 255, 0.15); }
.dev-btn { background: transparent; border: none; color: var(--kos-muted); padding: 2px 6px; height: 26px; border-radius: 4px; font-size: 0.7rem; font-weight: 700; cursor: pointer; transition: var(--tr); white-space: nowrap; }
.dev-btn:hover, .dev-btn.active { color: var(--white); background: rgba(255, 255, 255, 0.15); }
.dev-btn.active { color: var(--kos-cyan); font-weight: 900; }

.btn-action {
  background: rgba(255, 255, 255, 0.08); color: var(--white); border: 1px solid rgba(255, 255, 255, 0.18);
  padding: 0 10px; height: 32px; border-radius: var(--radius-pill); text-decoration: none; font-size: 0.74rem; font-weight: 800;
  cursor: pointer; transition: var(--tr); display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;
}
.btn-action:hover { background: var(--white); color: #000; }

.btn-feedback-cta {
  background: linear-gradient(135deg, #22d3ee 0%, #06b6d4 100%); color: #000000;
  border: none; padding: 0 12px; height: 32px; border-radius: var(--radius-pill);
  font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 900; font-size: 0.76rem;
  cursor: pointer; transition: var(--tr); display: inline-flex; align-items: center; gap: 4px;
  white-space: nowrap; box-shadow: 0 0 15px rgba(34, 211, 238, 0.6); flex-shrink: 0;
}
.btn-feedback-cta:hover { transform: translateY(-1px); box-shadow: 0 0 22px rgba(34, 211, 238, 0.9); }

/* MAIN STAGE RESPONSIVO */
.stage {
  width: 100%; height: calc(100vh - 52px); display: flex; justify-content: center; align-items: center;
  background: #030504; padding: 0; margin: 0 auto; position: relative; overflow: hidden; gap: 10px; box-sizing: border-box;
}

.iframe-wrapper {
  width: 100%; height: 100%; border-radius: 0; overflow: hidden; background: #fff;
  box-shadow: var(--shadow-lg); transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1); border: none;
  position: relative; flex: 1;
}

.iframe-wrapper.laptop { max-width: 1180px; height: 96%; border-radius: 18px; border: 10px solid #1a1a1a; margin: 0 auto; }
.iframe-wrapper.tablet { max-width: 768px; height: 96%; border-radius: 24px; border: 12px solid #1a1a1a; margin: 0 auto; }
.iframe-wrapper.mobile { max-width: 380px; height: 800px; max-height: 96%; border-radius: 36px; border: 10px solid #1a1a1a; position: relative; margin: 0 auto; }
.iframe-wrapper.mobile::before { content: ''; position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: 90px; height: 20px; background: #000; border-radius: 16px; z-index: 10; }

iframe { width: 100%; height: 100%; border: none; display: block; }

/* MODAL QR CODE */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0, 0, 0, 0.88); backdrop-filter: blur(14px);
  display: flex; align-items: center; justify-content: center; z-index: 2000;
  opacity: 0; pointer-events: none; transition: var(--tr); padding: 16px;
}
.modal-overlay.open { opacity: 1; pointer-events: auto; }
.modal-card {
  background: #0d150f; border: 1.5px solid var(--kos-cyan); border-radius: 24px;
  padding: 28px 20px; max-width: 380px; width: 100%; text-align: center; box-shadow: var(--shadow-lg);
  position: relative; transform: scale(0.9); transition: var(--tr);
}
.modal-overlay.open .modal-card { transform: scale(1); }
.modal-close { position: absolute; top: 12px; right: 12px; background: transparent; border: none; color: var(--kos-muted); font-size: 1.4rem; cursor: pointer; }
.qr-frame { background: #fff; padding: 10px; border-radius: 14px; display: inline-block; margin: 14px 0; }
.qr-frame img { width: 160px; height: 160px; display: block; }

/* GAVETA FEEDBACK */
.feedback-drawer {
  position: fixed; right: -440px; top: 0; bottom: 0; width: 400px; max-width: 100%; background: #0d150f;
  border-left: 1.5px solid var(--kos-cyan); box-shadow: var(--shadow-lg); z-index: 2000;
  padding: 22px; display: flex; flex-direction: column; transition: right 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  overflow-y: auto;
}
.feedback-drawer.open { right: 0; }
.drawer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.drawer-title { font-family: 'Syne', sans-serif; font-size: 1.15rem; font-weight: 800; color: var(--white); }

@media (max-width: 900px) {
  .device-btn-group { display: none; }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="header-left">
    <a href="#" class="kos-brand-logo">
      <img src="assets/kos-logo.png" alt="KOS Web & Automação" class="kos-brand-img">
      <div class="kos-brand-sub">Web &amp; Automação</div>
    </a>

    <!-- NOME FIXO DO CLIENTE -->
    <div class="client-label-badge">
      <span>👤</span> <span id="clientNameText">Dra. Silvia de Oliveira Lemos</span>
    </div>

    <!-- BADGE DE MODELO APROVADO -->
    <div class="approved-badge">
      <span>🌿</span> Opção D (Aprovado)
    </div>
  </div>

  <div class="header-center">
  </div>

  <div class="header-right">
    <div class="device-btn-group">
      <button class="dev-btn active" onclick="setDevice('desktop', this)" title="PC Desktop">🖥️ PC</button>
      <button class="dev-btn" onclick="setDevice('laptop', this)" title="Notebook">💻 Notebook</button>
      <button class="dev-btn" onclick="setDevice('tablet', this)" title="Tablet">📱 Tablet</button>
      <button class="dev-btn" onclick="setDevice('mobile', this)" title="Celular">📲 Celular</button>
    </div>

    <button class="btn-action" onclick="openQrModal()" title="Testar no celular real">
      📱 QR Code
    </button>

    <button class="btn-action" onclick="copyShareableLink()" title="Copiar link do site" id="copyBtn">
      🔗 Copiar Link
    </button>

    <a href="clientes/silvia-nutri/opcao-d.html" target="_blank" id="fullScreenBtn" class="btn-feedback-cta" title="Abrir site em tela cheia">
      ↗️ Abrir Site Aprovado
    </a>
  </div>
</header>

<main class="stage" id="mainStage">
  <div class="iframe-wrapper" id="iframeWrapper">
    <iframe src="clientes/silvia-nutri/opcao-d.html" id="prototypeFrame" title="Site Aprovado Dra. Silvia"></iframe>
  </div>
</main>

<div class="modal-overlay" id="qrModal">
  <div class="modal-card">
    <button class="modal-close" onclick="closeQrModal()">×</button>
    <div style="font-family: 'Syne', sans-serif; font-size: 1.2rem; font-weight: 800; color: var(--white);">Testar no Celular Real</div>
    <p style="font-size: 0.82rem; color: var(--kos-muted); margin-top: 6px;">
      Aponte a câmera do seu smartphone para o QR Code abaixo para abrir o site da Dra. Silvia:
    </p>

    <div class="qr-frame">
      <img src="" id="qrCodeImg" alt="QR Code do Site Aprovado">
    </div>

    <div style="font-size: 0.85rem; color: #92a988; font-weight: 800;">Opção D (Modelo Aprovado)</div>
  </div>
</div>

<script src="kos-config.js"></script>

<script>
window.addEventListener('DOMContentLoaded', () => {
  setDevice('desktop', document.querySelector('.dev-btn.active'));
});

function setDevice(deviceType, btnEl) {
  document.querySelectorAll('.dev-btn').forEach(b => b.classList.remove('active'));
  if (btnEl) btnEl.classList.add('active');

  const wrapper = document.getElementById('iframeWrapper');
  wrapper.className = 'iframe-wrapper ' + (deviceType === 'desktop' ? '' : deviceType);
}

function copyShareableLink() {
  const shareUrl = `${window.location.origin}${window.location.pathname.replace('index.html', '')}clientes/silvia-nutri/opcao-d.html`;
  navigator.clipboard.writeText(shareUrl).then(() => {
    alert(`Link do Site Aprovado Copiado com Sucesso!\n\nLink: ${shareUrl}`);
  }).catch(() => {
    prompt("Copie o link abaixo:", shareUrl);
  });
}

function openQrModal() {
  const shareUrl = `${window.location.origin}${window.location.pathname.replace('index.html', '')}clientes/silvia-nutri/opcao-d.html`;
  const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(shareUrl)}`;
  document.getElementById('qrCodeImg').src = qrApiUrl;
  document.getElementById('qrModal').classList.add('open');
}

function closeQrModal() {
  document.getElementById('qrModal').classList.remove('open');
}
</script>
</body>
</html>
